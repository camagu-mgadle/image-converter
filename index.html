<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fast, private and serverless browser-based imageconverter."
    />
    <title>Image Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <mian>
      <div class="container">
        <h2 id="title">Browser Image Converter</h2>
        <p class="description">
          For a fast, private and serverless browser-based imageconverter.
        </p>
        <input class="file-btn" type="file" id="upload" accept="image/*" />
        <div>
          <select class="select-key" id="format">
            <option>Choose type</option>
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>

        <button class="file-btn" onclick="convertImage()">Convert</button>

        <br /><br />

        <a id="download">Download Converted Image</a>
      </div>
    </mian>
    <script src="script.js"></script>
  </body>
</html>
